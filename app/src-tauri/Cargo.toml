[package]
name = "daiqiao"
version = "0.2.0"
description = "代敲 —— 内置 MCP 的本地终端"
edition = "2021"
rust-version = "1.77"
# 加了 stdio 桥（src/bin/daiqiao-mcp.rs）之后有两个 bin，
# cargo run / tauri dev 会不知道该跑哪个 —— 指明主程序。
default-run = "daiqiao"

[lib]
name = "daiqiao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 终端内核：PTY + 终端仿真（唯一解析点）
portable-pty = "0.9"
alacritty_terminal = "0.26"

# SSH / SFTP
russh = "0.65"
thiserror = "2"
russh-sftp = "3"

# 异步运行时 + MCP 的 HTTP 通道
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
axum = "0.8"

anyhow = "1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-dialog = "2.0.0-rc.8"
sha2 = "0.10"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
pbkdf2 = { version = "0.13.0", features = ["sha2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
